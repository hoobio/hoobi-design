name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node tokens/build.mjs --check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm -C catalog build

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: Check fontconfig
        run: dpkg -s libfontconfig1 > /dev/null || sudo apt-get install -y -qq libfontconfig1

      - run: dotnet build Hoobi.Design.slnx -c Release
        working-directory: dotnet

      - run: dotnet test --project tests/Hoobi.Design.Avalonia.Tests/Hoobi.Design.Avalonia.Tests.csproj -c Release --no-build
        working-directory: dotnet
