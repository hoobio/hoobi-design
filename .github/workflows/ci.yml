name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node tokens/build.mjs --check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm -C catalog build

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: dotnet/global.json

      - name: Check fontconfig
        run: dpkg -s libfontconfig1 > /dev/null || sudo apt-get install -y -qq libfontconfig1

      - run: dotnet build Hoobi.Design.slnx -c Release
        working-directory: dotnet

      - run: dotnet test --project tests/Hoobi.Design.Avalonia.Tests/Hoobi.Design.Avalonia.Tests.csproj -c Release --no-build
        working-directory: dotnet
