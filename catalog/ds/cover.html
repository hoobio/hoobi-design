<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hoobi Design</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        min-height: 0;
      }
      body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        overflow: hidden;
      }
      .cover {
        position: relative;
        width: 960px;
        height: 288px;
        overflow: hidden;
      }
      .art {
        position: absolute;
        top: 0;
        left: 480px;
        width: 480px;
        height: 288px;
      }
      .art svg {
        display: block;
      }
      .accent {
        fill: var(--color-accent);
      }
      .raised {
        fill: var(--color-surface-raised);
      }
      .yellow {
        fill: var(--color-accent-yellow);
      }
      .cyan {
        fill: var(--color-accent-cyan);
      }
      .orange {
        fill: var(--color-accent-orange);
      }
      .seam {
        fill: var(--color-bg);
      }
      .panel {
        rx: var(--radius-panel);
      }
      .chip {
        rx: var(--radius-chip);
      }
      .words {
        position: absolute;
        left: 24px;
        bottom: 24px;
        max-width: 440px;
      }
      .name {
        margin: 0;
        font-size: 96px;
        line-height: 0.95;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--color-text);
      }
      .tag {
        margin: 12px 0 0 4px;
        font-size: 14px;
        line-height: 20px;
        color: var(--color-text-dim);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 480 288" width="480" height="288">
          <!--
  blocks      color-accent 176x216 slab bled off the top (the one accent, largest) . color-surface-raised 288x232 panel bled off the right . color-accent-yellow 80x40 . color-accent-cyan and color-accent-orange only as 20px chips
  arrangement one tall accent slab with a sliced panel beside it and a yellow satellite under the slab, bottoms on one line 24px above the edge, 16px gutters
  pattern     the sliced card, from "Segmented cards are sliced: a 1px hairline of page background between full-bleed sections": three color-bg seams cut the panel into four rows, each holding a badge-sized chip
  scales      sides in spacing multiples (4px); gutters 16px; chips 20px tall like Badge; corners radius-panel 8px on blocks, radius-chip 4px on chips
-->
          <rect class="accent panel" x="16" y="-8" width="176" height="216" rx="8" />
          <rect class="yellow panel" x="16" y="224" width="80" height="40" rx="8" />
          <rect class="raised panel" x="208" y="32" width="288" height="232" rx="8" />
          <rect class="seam" x="208" y="90" width="288" height="1" />
          <rect class="seam" x="208" y="148" width="288" height="1" />
          <rect class="seam" x="208" y="206" width="288" height="1" />
          <rect class="cyan chip" x="224" y="52" width="56" height="20" rx="4" />
          <rect class="orange chip" x="224" y="110" width="40" height="20" rx="4" />
          <rect class="accent chip" x="224" y="168" width="72" height="20" rx="4" />
          <rect class="yellow chip" x="224" y="226" width="48" height="20" rx="4" />
        </svg>
      </div>
      <div class="words">
        <h1 class="name">Hoobi<br />Design</h1>
        <p class="tag">Fluent 2 in Ayu Mirage. Minimalism heavy.</p>
      </div>
    </div>
  </body>
</html>
